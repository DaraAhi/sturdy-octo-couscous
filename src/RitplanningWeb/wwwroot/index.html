<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ritplanning – Draloop Logistiek (fictief)</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 960px; margin: 2rem auto; padding: 0 1rem; color: #1b1b1b; }
  table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
  th, td { border: 1px solid #ccc; padding: .4rem .6rem; text-align: left; font-size: .9rem; }
  th { background: #2f5496; color: #fff; }
  .rol { display: inline-block; background: #eaf1fb; border: 1px solid #2f5496; border-radius: 4px; padding: 0 .4rem; margin-right: .3rem; }
  .fout { color: #b33a3a; }
</style>
</head>
<body>
<h1>Ritplanning</h1>
<p><small>Fictieve casus Draloop Logistiek B.V. – proof-of-concept</small></p>
<div id="wie">Laden…</div>
<p><a href="/.auth/logout">Uitloggen</a></p>
<table id="tabel" hidden>
  <thead><tr><th>Rit</th><th>Regio</th><th>Klant</th><th>Chauffeur</th><th>Vertrek</th><th>Bevestigd</th></tr></thead>
  <tbody></tbody>
</table>
<p id="melding" class="fout"></p>
<script>
async function laad() {
  const me = await fetch('/api/me');
  if (!me.ok) { document.getElementById('melding').textContent = 'Niet ingelogd of geen toegang (HTTP ' + me.status + ').'; return; }
  const g = await me.json();
  document.getElementById('wie').innerHTML =
    'Ingelogd als <strong></strong> ' + (g.rollen.length ? g.rollen.map(r => '<span class="rol"></span>').join('') : '<em>(geen rol toegewezen)</em>') +
    (g.regio ? ' – regio ' + g.regio : '') + ' <small>versie ' + g.versie + '</small>';
  document.querySelector('#wie strong').textContent = g.naam;
  document.querySelectorAll('#wie .rol').forEach((e, i) => e.textContent = g.rollen[i]);
  const r = await fetch('/api/ritten');
  const ritten = await r.json();
  const tb = document.querySelector('#tabel tbody');
  for (const x of ritten) {
    const tr = document.createElement('tr');
    [x.id, x.regio, x.klant, x.chauffeurId, new Date(x.vertrek).toLocaleString('nl-NL'), x.bevestigd ? 'ja' : 'nee']
      .forEach(v => { const td = document.createElement('td'); td.textContent = v; tr.appendChild(td); });
    tb.appendChild(tr);
  }
  document.getElementById('tabel').hidden = false;
}
laad();
</script>
</body>
</html>
